[package]
name = "votetracker-core"
version = "0.1.0"
edition = "2021"
authors = ["Mambuco <gabriele.giambrone@icloud.com>"]
description = "Core business logic, calculations, database, and electronic register sync for VoteTracker"
license = "GPL-3.0"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
base64 = "0.22"

[dev-dependencies]
tempfile = "3.17"
