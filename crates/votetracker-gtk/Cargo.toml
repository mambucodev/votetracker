[package]
name = "votetracker-gtk"
version = "0.1.0"
edition = "2021"
authors = ["Mambuco <gabriele.giambrone@icloud.com>"]
description = "Modern Libadwaita / GTK4 user interface for VoteTracker"
license = "GPL-3.0"

[dependencies]
votetracker-core = { path = "../votetracker-core" }
relm4 = { version = "0.11", features = ["libadwaita", "gnome_46"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
